server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/student_management?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true
    username: root
    password: '123456'
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      enabled: true
      mode: always
      schema-locations: classpath:schema.sql,classpath:fee.sql,classpath:pickup.sql,classpath:class_circle.sql,classpath:private_message.sql,classpath:teacher_performance.sql

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Flyway 数据库迁移配置（暂时禁用，因为 MySQL 5.5 不被支持）
  flyway:
    enabled: false

logging:
  level:
    com.example.studentmanagement: INFO
    org.hibernate.SQL: INFO

file:
  upload-dir: uploads
