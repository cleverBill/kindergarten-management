<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧幼儿园 - 家长端</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        
        .container { max-width: 400px; margin: 0 auto; padding: 20px; }
        .login-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #667eea; font-size: 24px; margin-top: 10px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        .form-input { width: 100%; padding: 15px; border: 2px solid #eee; border-radius: 12px; font-size: 16px; transition: border-color 0.3s; }
        .form-input:focus { outline: none; border-color: #667eea; }
        .form-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
        .form-btn:active { transform: scale(0.98); }
        .separator { text-align: center; margin: 20px 0; color: #999; font-size: 14px; }
        .nav-tabs { display: flex; background: white; border-radius: 12px; padding: 5px; margin-bottom: 20px; }
        .nav-tab { flex: 1; padding: 12px; text-align: center; border-radius: 8px; font-weight: 500; cursor: pointer; transition: all 0.3s; }
        .nav-tab.active { background: #667eea; color: white; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-size: 18px; font-weight: 600; color: #333; }
        .card-subtitle { font-size: 14px; color: #999; }
        
        .post-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        .post-header { display: flex; align-items: center; margin-bottom: 15px; }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; margin-right: 12px; }
        .post-info { flex: 1; }
        .post-author { font-weight: 600; color: #333; }
        .post-time { font-size: 12px; color: #999; }
        .post-content { margin-bottom: 15px; line-height: 1.6; }
        .post-image { width: 100%; border-radius: 12px; margin-bottom: 15px; }
        .post-actions { display: flex; gap: 20px; }
        .action-btn { display: flex; align-items: center; gap: 5px; color: #666; font-size: 14px; cursor: pointer; }
        .action-btn.active { color: #e74c3c; }
        
        .message-item { display: flex; padding: 15px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .message-avatar { width: 45px; height: 45px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; margin-right: 12px; }
        .message-info { flex: 1; }
        .message-name { font-weight: 600; color: #333; }
        .message-preview { font-size: 13px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .message-time { font-size: 12px; color: #ccc; }
        .badge { background: #e74c3c; color: white; font-size: 11px; padding: 2px 6px; border-radius: 10px; }
        
        .fee-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #f0f0f0; }
        .fee-info { flex: 1; }
        .fee-name { font-weight: 600; color: #333; }
        .fee-date { font-size: 13px; color: #999; }
        .fee-amount { font-size: 18px; font-weight: 600; color: #e74c3c; }
        .fee-status { font-size: 12px; padding: 4px 10px; border-radius: 20px; }
        .fee-status.paid { background: #d4edda; color: #155724; }
        .fee-status.unpaid { background: #f8d7da; color: #721c24; }
        
        .record-item { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid #f0f0f0; }
        .record-info { flex: 1; }
        .record-type { font-weight: 600; color: #333; }
        .record-time { font-size: 13px; color: #999; }
        .record-person { font-size: 13px; color: #666; }
        
        .notification { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 15px 30px; border-radius: 10px; display: none; z-index: 1000; }
        .notification.show { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        
        .profile-section { text-align: center; padding: 30px; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: white; font-size: 30px; font-weight: 600; }
        .profile-name { font-size: 20px; font-weight: 600; color: #333; margin-bottom: 5px; }
        .profile-role { font-size: 14px; color: #999; }
        
        .menu-list { margin-top: 20px; }
        .menu-item { display: flex; align-items: center; padding: 20px; background: white; border-radius: 16px; margin-bottom: 10px; cursor: pointer; }
        .menu-icon { width: 45px; height: 45px; border-radius: 12px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 15px; }
        .menu-text { flex: 1; font-weight: 500; color: #333; }
        .menu-arrow { color: #ccc; font-size: 16px; }
        
        .child-selector { background: white; border-radius: 12px; padding: 10px; margin-bottom: 20px; }
        .child-item { padding: 12px; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .child-item.active { background: #667eea; color: white; }
        .child-item.active .child-class { color: rgba(255,255,255,0.8); }
        .child-name { font-weight: 600; }
        .child-class { font-size: 13px; color: #999; }
    </style>
</head>
<body>
    <div class="container" id="loginContainer">
        <div class="login-card">
            <div class="logo">
                <div style="font-size: 48px;">🏠</div>
                <h1>智慧幼儿园</h1>
                <p style="color: #999; font-size: 14px; margin-top: 5px;">家长端</p>
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" class="form-input" id="parentPhone" placeholder="请输入手机号">
            </div>
            <div class="form-group">
                <label>验证码</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" class="form-input" id="parentCode" placeholder="请输入验证码" style="flex: 1;">
                    <button class="form-btn" style="width: 100px; font-size: 13px;" onclick="sendCode()">获取验证码</button>
                </div>
            </div>
            <button class="form-btn" onclick="parentLogin()">登录</button>
            <div class="separator">或</div>
            <button class="form-btn" style="background: #f0f0f0; color: #333;" onclick="showRegister()">立即注册</button>
        </div>
    </div>

    <div class="container" id="registerContainer" style="display: none;">
        <div class="login-card">
            <div class="logo">
                <div style="font-size: 48px;">👶</div>
                <h1>家长注册</h1>
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="tel" class="form-input" id="regPhone" placeholder="请输入手机号">
            </div>
            <div class="form-group">
                <label>验证码</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" class="form-input" id="regCode" placeholder="请输入验证码" style="flex: 1;">
                    <button class="form-btn" style="width: 100px; font-size: 13px;" onclick="sendRegCode()">获取验证码</button>
                </div>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" class="form-input" id="regPassword" placeholder="请设置密码">
            </div>
            <div class="form-group">
                <label>学生姓名</label>
                <input type="text" class="form-input" id="regChildName" placeholder="请输入孩子姓名">
            </div>
            <button class="form-btn" onclick="parentRegister()">注册</button>
            <button class="form-btn" style="background: #f0f0f0; color: #333; margin-top: 10px;" onclick="showLogin()">返回登录</button>
        </div>
    </div>

    <div class="container" id="mainContainer" style="display: none;">
        <div class="profile-section">
            <div class="profile-avatar" id="parentAvatar"></div>
            <div class="profile-name" id="parentName"></div>
            <div class="profile-role">家长</div>
            
            <div class="child-selector" id="childSelector">
            </div>
        </div>

        <div class="nav-tabs">
            <div class="nav-tab active" onclick="showParentTab('circle')">🌸 班级圈</div>
            <div class="nav-tab" onclick="showParentTab('messages')">💬 消息</div>
            <div class="nav-tab" onclick="showParentTab('fees')">💰 缴费</div>
            <div class="nav-tab" onclick="showParentTab('records')">📋 记录</div>
        </div>

        <div class="tab-content active" id="circleTab">
            <div id="circleList"></div>
            <div style="text-align: center; color: #999; padding: 20px;">下拉刷新</div>
        </div>

        <div class="tab-content" id="messagesTab">
            <div id="messageList"></div>
        </div>

        <div class="tab-content" id="feesTab">
            <div id="feeList"></div>
        </div>

        <div class="tab-content" id="recordsTab">
            <div id="recordList"></div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        const API_URL = 'http://localhost:8080/api';
        let currentUser = null;
        let currentChildId = null;

        function showNotification(msg) {
            const n = document.getElementById('notification');
            n.textContent = msg;
            n.classList.add('show');
            setTimeout(() => n.classList.remove('show'), 2000);
        }

        function showLogin() {
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('registerContainer').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'none';
        }

        function showRegister() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('registerContainer').style.display = 'block';
            document.getElementById('mainContainer').style.display = 'none';
        }

        function showMain() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('registerContainer').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
        }

        async function sendCode() {
            const phone = document.getElementById('parentPhone').value;
            if (!phone) {
                showNotification('请输入手机号');
                return;
            }
            showNotification('验证码已发送');
        }

        async function sendRegCode() {
            const phone = document.getElementById('regPhone').value;
            if (!phone) {
                showNotification('请输入手机号');
                return;
            }
            showNotification('验证码已发送');
        }

        async function parentLogin() {
            const phone = document.getElementById('parentPhone').value;
            const code = document.getElementById('parentCode').value;
            
            if (!phone || !code) {
                showNotification('请填写完整信息');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: phone, password: '123456' })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    currentUser = { id: data.data.id, username: phone };
                    document.getElementById('parentAvatar').textContent = phone.slice(-4);
                    document.getElementById('parentName').textContent = phone;
                    loadChildren();
                    showMain();
                    showNotification('登录成功');
                } else {
                    showNotification('登录失败');
                }
            } catch (error) {
                console.error('登录失败:', error);
                showNotification('登录失败');
            }
        }

        async function parentRegister() {
            const phone = document.getElementById('regPhone').value;
            const code = document.getElementById('regCode').value;
            const password = document.getElementById('regPassword').value;
            const childName = document.getElementById('regChildName').value;

            if (!phone || !code || !password || !childName) {
                showNotification('请填写完整信息');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/users/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: phone, 
                        password: password, 
                        role: 'parent',
                        childName: childName 
                    })
                });

                if (response.ok) {
                    showNotification('注册成功，请等待审核');
                    showLogin();
                } else {
                    showNotification('注册失败');
                }
            } catch (error) {
                console.error('注册失败:', error);
                showNotification('注册失败');
            }
        }

        async function loadChildren() {
            try {
                const response = await fetch(`${API_URL}/students`);
                if (response.ok) {
                    const students = await response.json();
                    const selector = document.getElementById('childSelector');
                    selector.innerHTML = students.map((s, i) => `
                        <div class="child-item ${i === 0 ? 'active' : ''}" onclick="selectChild(${s.id})">
                            <div class="child-name">${s.name}</div>
                            <div class="child-class">${s.className}</div>
                        </div>
                    `).join('');
                    if (students.length > 0) {
                        currentChildId = students[0].id;
                        loadCirclePosts();
                        loadMessages();
                        loadFees();
                        loadRecords();
                    }
                }
            } catch (error) {
                console.error('加载学生列表失败:', error);
            }
        }

        function selectChild(childId) {
            currentChildId = childId;
            document.querySelectorAll('.child-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
            loadCirclePosts();
            loadMessages();
            loadFees();
            loadRecords();
        }

        function showParentTab(tabId) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId + 'Tab').classList.add('active');
        }

        async function loadCirclePosts() {
            try {
                const response = await fetch(`${API_URL}/class-circle/posts`);
                if (response.ok) {
                    const data = await response.json();
                    const posts = data.data || [];
                    renderCirclePosts(posts);
                }
            } catch (error) {
                console.error('加载班级圈失败:', error);
            }
        }

        function renderCirclePosts(posts) {
            const list = document.getElementById('circleList');
            if (posts.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: #999; padding: 30px;">暂无动态</div>';
                return;
            }
            list.innerHTML = posts.map(post => `
                <div class="post-card">
                    <div class="post-header">
                        <div class="post-avatar">${post.authorName?.charAt(0) || '👤'}</div>
                        <div class="post-info">
                            <div class="post-author">${post.authorName || '老师'}</div>
                            <div class="post-time">${post.createdAt}</div>
                        </div>
                    </div>
                    <div class="post-content">${post.content}</div>
                    ${post.imageUrl ? `<img src="${post.imageUrl}" class="post-image">` : ''}
                    <div class="post-actions">
                        <div class="action-btn" onclick="likePost(${post.id})">
                            <span>❤️</span>
                            <span>${post.likeCount}</span>
                        </div>
                        <div class="action-btn" onclick="showComments(${post.id})">
                            <span>💬</span>
                            <span>${post.commentCount}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function likePost(postId) {
            try {
                await fetch(`${API_URL}/class-circle/posts/${postId}/like`, {
                    method: 'POST',
                    headers: { 'X-User-Id': currentUser.id }
                });
                loadCirclePosts();
            } catch (error) {
                console.error('点赞失败:', error);
            }
        }

        async function showComments(postId) {
            showNotification('评论功能开发中');
        }

        async function loadMessages() {
            try {
                const response = await fetch(`${API_URL}/messages/conversations`, {
                    headers: { 'X-User-Id': currentUser.id }
                });
                if (response.ok) {
                    const data = await response.json();
                    const conversations = data.data || [];
                    renderMessages(conversations);
                }
            } catch (error) {
                console.error('加载消息失败:', error);
            }
        }

        function renderMessages(conversations) {
            const list = document.getElementById('messageList');
            if (conversations.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: #999; padding: 30px;">暂无消息</div>';
                return;
            }
            list.innerHTML = conversations.map(c => `
                <div class="message-item" onclick="openChat(${c.otherUserId})">
                    <div class="message-avatar">${c.otherUserName?.charAt(0) || '👤'}</div>
                    <div class="message-info">
                        <div class="message-name">${c.otherUserName}</div>
                        <div class="message-preview">${c.lastMessage}</div>
                    </div>
                    <div>
                        <div class="message-time">${c.lastTime}</div>
                        ${c.unreadCount > 0 ? `<span class="badge">${c.unreadCount}</span>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function openChat(userId) {
            showNotification('聊天功能开发中');
        }

        async function loadFees() {
            try {
                const response = await fetch(`${API_URL}/fee/items`);
                if (response.ok) {
                    const data = await response.json();
                    const items = data.data || [];
                    renderFees(items);
                }
            } catch (error) {
                console.error('加载缴费失败:', error);
            }
        }

        function renderFees(items) {
            const list = document.getElementById('feeList');
            if (items.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: #999; padding: 30px;">暂无缴费项目</div>';
                return;
            }
            list.innerHTML = items.map(item => `
                <div class="card">
                    <div class="card-header">
                        <div>
                            <div class="card-title">${item.name}</div>
                            <div class="card-subtitle">截止日期: ${item.deadline}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 20px; font-weight: 600; color: #e74c3c;">¥${item.amount}</div>
                            <div class="fee-status ${item.status}">${item.status === 'active' ? '进行中' : '已结束'}</div>
                        </div>
                    </div>
                    <button class="form-btn" style="margin-top: 15px;" onclick="payFee(${item.id})">立即缴费</button>
                </div>
            `).join('');
        }

        function payFee(itemId) {
            showNotification('缴费功能开发中');
        }

        async function loadRecords() {
            try {
                const response = await fetch(`${API_URL}/pickup/students/${currentChildId}/records`);
                if (response.ok) {
                    const data = await response.json();
                    const records = data.data || [];
                    renderRecords(records);
                }
            } catch (error) {
                console.error('加载记录失败:', error);
            }
        }

        function renderRecords(records) {
            const list = document.getElementById('recordList');
            if (records.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: #999; padding: 30px;">暂无接送记录</div>';
                return;
            }
            list.innerHTML = records.map(r => `
                <div class="record-item">
                    <div class="record-info">
                        <div class="record-type">${r.pickupType === 'in' ? '🏠 入园' : '🏃 离园'}</div>
                        <div class="record-time">${r.pickupTime}</div>
                        ${r.pickupPersonName ? `<div class="record-person">接送人: ${r.pickupPersonName}</div>` : ''}
                    </div>
                    <div>
                        <span class="fee-status ${r.status === 'normal' ? 'paid' : 'unpaid'}">${r.status === 'normal' ? '正常' : '异常'}</span>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
