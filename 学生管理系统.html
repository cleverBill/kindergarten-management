<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👧 学生管理系统 👦</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Microsoft YaHei', cursive, sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ffecd2 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .decoration {
            position: fixed;
            font-size: 48px;
            opacity: 0.5;
            pointer-events: none;
            animation: float 3s ease-in-out infinite;
        }

        .cloud { top: 5%; right: 5%; animation-delay: 0s; }
        .star { top: 15%; left: 10%; animation-delay: 1s; }
        .rainbow { bottom: 10%; right: 15%; animation-delay: 2s; }
        .heart { top: 30%; right: 25%; animation-delay: 0.5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 40px 50px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(255, 138, 171, 0.3);
            text-align: center;
        }

        .login-box h1 {
            color: #ff8fab;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .login-input {
            display: block;
            width: 300px;
            padding: 15px;
            margin: 15px 0;
            border: 3px solid #ffd6e0;
            border-radius: 20px;
            font-size: 1.1em;
            transition: all 0.3s;
        }

        .login-input:focus {
            outline: none;
            border-color: #ff8fab;
            box-shadow: 0 0 15px rgba(255, 138, 171, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1.2em;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 107, 157, 0.4);
        }

        .login-error {
            color: #ff4757;
            margin-top: 15px;
            font-size: 1.1em;
        }

        .main-container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #ff6b9d;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .logout-btn {
            padding: 10px 25px;
            background: #ff6b9d;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #c44569;
            transform: scale(1.05);
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 12px 30px;
            background: white;
            border: 3px solid #ffd6e0;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            border-color: #ff8fab;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 138, 171, 0.3);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border-color: #ff6b9d;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        .stat-box .number {
            font-size: 2.5em;
            color: #ff6b9d;
            font-weight: bold;
        }

        .stat-box .label {
            color: #888;
            font-size: 1.1em;
            margin-top: 5px;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .form-container h2 {
            color: #ff6b9d;
            margin-bottom: 25px;
            font-size: 1.8em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 1.1em;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 15px;
            border: 3px solid #ffd6e0;
            border-radius: 15px;
            font-size: 1.1em;
            transition: all 0.3s;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #ff8fab;
            box-shadow: 0 0 15px rgba(255, 138, 171, 0.3);
        }

        .form-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .form-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 107, 157, 0.4);
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 15px;
            margin-top: 20px;
            text-align: center;
            font-size: 1.2em;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .student-card {
            background: white;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .student-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
        }

        .student-card h3 {
            color: #ff6b9d;
            font-size: 1.5em;
            margin-bottom: 15px;
        }

        .student-card p {
            margin: 8px 0;
            color: #555;
            font-size: 1.05em;
        }

        .status-tag {
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .status-normal { background: #d4edda; color: #155724; }
        .status-warning { background: #fff3cd; color: #856404; }
        .status-excellent { background: #d1ecf1; color: #0c5460; }

        .card-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 15px;
            font-size: 1em;
            cursor: pointer;
            margin-right: 10px;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .card-btn-primary {
            background: #6c5ce7;
            color: white;
        }

        .card-btn-primary:hover {
            background: #5b4cdb;
            transform: translateY(-2px);
        }

        .card-btn-danger {
            background: #ff6b9d;
            color: white;
        }

        .card-btn-danger:hover {
            background: #c44569;
            transform: translateY(-2px);
        }

        .list-container {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .list-container h2 {
            color: #ff6b9d;
            margin-bottom: 20px;
        }

        .list-item {
            padding: 15px;
            background: #fff5f8;
            border-radius: 15px;
            margin: 10px 0;
            font-size: 1.1em;
        }

        .hidden {
            display: none !important;
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: #ff8fab;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="decoration cloud">☁️</div>
    <div class="decoration star">⭐</div>
    <div class="decoration rainbow">🌈</div>
    <div class="decoration heart">❤️</div>

    <div id="loginPage">
        <div class="login-container">
            <div class="login-box">
                <h1>👧 学生管理系统 👦</h1>
                <input type="text" class="login-input" id="loginUsername" placeholder="用户名">
                <input type="password" class="login-input" id="loginPassword" placeholder="密码" onkeypress="if(event.key==='Enter') login()">
                <button class="login-btn" onclick="login()">登录</button>
                <div id="loginError"></div>
            </div>
        </div>
    </div>

    <div id="mainPage" class="hidden">
        <div class="main-container">
            <header class="header">
                <div class="header-content">
                    <h1>👧 学生管理系统 👦</h1>
                    <button class="logout-btn" onclick="logout()">退出登录</button>
                </div>
            </header>

            <div class="nav-tabs">
                <button class="nav-btn active" onclick="showTab('students')">👧 学生管理</button>
                <button class="nav-btn" onclick="showTab('rewards')">🏆 奖励记录</button>
                <button class="nav-btn" onclick="showTab('attendance')">📅 考勤管理</button>
                <button class="nav-btn" onclick="showTab('homework')">📝 作业管理</button>
            </div>

            <main class="content">
                <div class="stats-container">
                    <div class="stat-box">
                        <div class="number" id="statStudents">0</div>
                        <div class="label">小朋友总数</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" id="statRewards">0</div>
                        <div class="label">奖励总数</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" id="statAttendance">0</div>
                        <div class="label">考勤记录</div>
                    </div>
                    <div class="stat-box">
                        <div class="number" id="statHomework">0</div>
                        <div class="label">作业记录</div>
                    </div>
                </div>

                <div id="students" class="tab-content">
                    <div class="form-container">
                        <h2>添加新小朋友 🎉</h2>
                        <form id="addStudentForm" onsubmit="handleAddStudent(event)">
                            <div class="form-group">
                                <label>👧 姓名</label>
                                <input type="text" class="form-input" name="name" placeholder="请输入小朋友姓名" required>
                            </div>
                            <div class="form-group">
                                <label>📚 年级</label>
                                <select class="form-select" name="grade" required>
                                    <option value="">请选择年级</option>
                                    <option value="小班">小班</option>
                                    <option value="中班">中班</option>
                                    <option value="大班">大班</option>
                                    <option value="一年级">一年级</option>
                                    <option value="二年级">二年级</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>🏠 班级</label>
                                <input type="text" class="form-input" name="classInfo" placeholder="请输入班级名称" required>
                            </div>
                            <div class="form-group">
                                <label>💖 状态</label>
                                <select class="form-select" name="status">
                                    <option value="正常">正常</option>
                                    <option value="优秀">优秀</option>
                                    <option value="需关注">需关注</option>
                                </select>
                            </div>
                            <button type="submit" class="form-btn">添加小朋友</button>
                            <div id="addSuccess" class="hidden">✅ 添加成功！</div>
                        </form>
                    </div>

                    <div id="studentList" class="student-grid">
                        <p style="color: #ff8fab; grid-column: 1/-1; text-align: center; font-size: 1.3em;">还没有小朋友哦~ 快添加一些吧！🥰</p>
                    </div>
                </div>

                <div id="rewards" class="tab-content hidden">
                    <div class="form-container">
                        <h2>奖励小朋友 🏆</h2>
                        <div class="form-group">
                            <label>👧 选择小朋友</label>
                            <select class="form-select" id="rewardStudent">
                                <option value="">请先添加小朋友</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>🏆 奖励类型</label>
                            <select class="form-select" id="rewardType">
                                <option value="朵小花">🌸 小花</option>
                                <option value="颗星星">⭐ 星星</option>
                                <option value="个小红旗">🚩 小红旗</option>
                                <option value="块小饼干">🍪 小饼干</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>💝 奖励原因</label>
                            <input type="text" class="form-input" id="rewardReason" placeholder="为什么奖励这位小朋友呢？">
                        </div>
                        <button class="form-btn" onclick="handleAddReward()">颁发奖励</button>
                    </div>

                    <div id="rewardList" class="list-container">
                        <h2>奖励记录 🎉</h2>
                        <p style="color: #ff8fab;">还没有奖励记录~ 快去奖励小朋友吧！🎉</p>
                    </div>
                </div>

                <div id="attendance" class="tab-content hidden">
                    <div class="form-container">
                        <h2>记录考勤 📅</h2>
                        <div class="form-group">
                            <label>👧 选择小朋友</label>
                            <select class="form-select" id="attendanceStudent">
                                <option value="">请先添加小朋友</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>📅 日期</label>
                            <input type="date" class="form-input" id="attendanceDate">
                        </div>
                        <div class="form-group">
                            <label>💼 状态</label>
                            <select class="form-select" id="attendanceStatus">
                                <option value="准时到校">✅ 准时到校</option>
                                <option value="迟到">⏰ 迟到</option>
                                <option value="缺勤">❌ 缺勤</option>
                                <option value="请假">🏥 请假</option>
                            </select>
                        </div>
                        <button class="form-btn" onclick="handleAddAttendance()">记录考勤</button>
                    </div>

                    <div id="attendanceStats" class="list-container">
                        <h2>考勤统计 📊</h2>
                        <p style="color: #ff8fab;">还没有小朋友~</p>
                    </div>
                </div>

                <div id="homework" class="tab-content hidden">
                    <div class="form-container">
                        <h2>记录作业 📝</h2>
                        <div class="form-group">
                            <label>👧 选择小朋友</label>
                            <select class="form-select" id="homeworkStudent">
                                <option value="">请先添加小朋友</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>📚 作业名称</label>
                            <input type="text" class="form-input" id="homeworkName" placeholder="请输入作业名称">
                        </div>
                        <div class="form-group">
                            <label>⭐ 分数</label>
                            <input type="number" class="form-input" id="homeworkScore" min="0" max="100" value="100">
                        </div>
                        <div class="form-group">
                            <label>📅 日期</label>
                            <input type="date" class="form-input" id="homeworkDate">
                        </div>
                        <button class="form-btn" onclick="handleAddHomework()">记录作业</button>
                    </div>

                    <div id="homeworkStats" class="list-container">
                        <h2>作业统计 📚</h2>
                        <p style="color: #ff8fab;">还没有小朋友~</p>
                    </div>
                </div>
            </main>

            <div class="footer">
                <p>💕 用心记录每一个小朋友的成长 💕</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api';
        let data = { students: [], rewards: [] };

        async function loadData() {
            try {
                const response = await fetch(`${API_URL}/students`);
                data.students = await response.json();
                
                const rewardResponse = await fetch(`${API_URL}/rewards`);
                data.rewards = await rewardResponse.json();
            } catch (error) {
                console.error('加载数据失败:', error);
                alert('加载数据失败，请确保后端服务已启动！');
            }
        }

        function checkLogin() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (isLoggedIn) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainPage').classList.remove('hidden');
                loadData().then(updateUI);
            }
        }

        function login() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            if (username === 'admin' && password === '123456') {
                localStorage.setItem('isLoggedIn', 'true');
                document.getElementById('loginError').innerHTML = '';
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainPage').classList.remove('hidden');
                loadData().then(updateUI);
            } else {
                document.getElementById('loginError').innerHTML = '❌ 用户名或密码错误！';
            }
        }

        function logout() {
            localStorage.setItem('isLoggedIn', 'false');
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('loginUsername').value = '';
            document.getElementById('loginPassword').value = '';
        }

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.remove('hidden');
            event.target.classList.add('active');
            loadData().then(updateUI);
        }

        async function updateUI() {
            await loadData();
            updateStudentList();
            updateSelects();
            updateRewardList();
            updateAttendanceStats();
            updateHomeworkStats();
            updateStats();
        }

        function getStatusClass(status) {
            switch(status) {
                case '正常': return 'status-normal';
                case '需关注': return 'status-warning';
                case '优秀': return 'status-excellent';
                default: return 'status-normal';
            }
        }

        function updateStudentList() {
            const container = document.getElementById('studentList');
            if (data.students.length === 0) {
                container.innerHTML = '<p style="color: #ff8fab; grid-column: 1/-1; text-align: center; font-size: 1.3em;">还没有小朋友哦~ 快添加一些吧！🥰</p>';
                return;
            }
            container.innerHTML = data.students.map(s => `
                <div class="student-card">
                    <h3>👧 ${s.name}</h3>
                    <p><strong>📚 年级:</strong> ${s.grade}</p>
                    <p><strong>🏠 班级:</strong> ${s.className}</p>
                    <p><strong>💖 状态:</strong> <span class="status-tag ${getStatusClass(s.status)}">${s.status}</span></p>
                    <p><strong>⭐ 奖励:</strong> ${s.rewards ? s.rewards.length : 0}个 | <strong>📅 考勤:</strong> ${s.attendance ? s.attendance.length : 0}次 | <strong>📝 作业:</strong> ${s.homework ? s.homework.length : 0}次</p>
                    <div style="margin-top: 15px;">
                        <button class="card-btn card-btn-primary" onclick="viewStudentDetail(${s.id})">查看详情</button>
                        <button class="card-btn card-btn-danger" onclick="deleteStudent(${s.id})">删除</button>
                    </div>
                </div>
            `).join('');
        }

        function updateSelects() {
            if (data.students.length === 0) {
                document.getElementById('rewardStudent').innerHTML = '<option value="">请先添加小朋友</option>';
                document.getElementById('attendanceStudent').innerHTML = '<option value="">请先添加小朋友</option>';
                document.getElementById('homeworkStudent').innerHTML = '<option value="">请先添加小朋友</option>';
            } else {
                const studentNames = data.students.map(s => `<option value="${s.id}">👧 ${s.name}</option>`).join('');
                document.getElementById('rewardStudent').innerHTML = studentNames;
                document.getElementById('attendanceStudent').innerHTML = studentNames;
                document.getElementById('homeworkStudent').innerHTML = studentNames;
            }
            document.getElementById('attendanceDate').valueAsDate = new Date();
            document.getElementById('homeworkDate').valueAsDate = new Date();
        }

        function updateRewardList() {
            const container = document.getElementById('rewardList');
            if (!data.rewards || data.rewards.length === 0) {
                container.innerHTML = '<p style="color: #ff8fab;">还没有奖励记录~ 快去奖励小朋友吧！🎉</p>';
                return;
            }
            container.innerHTML = data.rewards.slice(-10).reverse().map(r => {
                const student = data.students.find(s => s.id === r.studentId);
                return `<div class="list-item">🎉 <strong>${student ? student.name : '未知'}</strong> 获得了 ${r.type}！${r.reason ? '- ' + r.reason : ''} (${r.date})</div>`;
            }).join('');
        }

        function updateAttendanceStats() {
            const container = document.getElementById('attendanceStats');
            if (data.students.length === 0) {
                container.innerHTML = '<p style="color: #ff8fab;">还没有小朋友~</p>';
                return;
            }
            container.innerHTML = data.students.map(s => {
                const attendance = s.attendance || [];
                const total = attendance.length;
                const present = attendance.filter(a => a.status === '准时到校').length;
                const rate = total > 0 ? (present / total * 100).toFixed(1) : 0;
                return `<div class="list-item">📊 <strong>${s.name}</strong>: 出勤率 ${rate}% (${present}/${total}天)</div>`;
            }).join('');
        }

        function updateHomeworkStats() {
            const container = document.getElementById('homeworkStats');
            if (data.students.length === 0) {
                container.innerHTML = '<p style="color: #ff8fab;">还没有小朋友~</p>';
                return;
            }
            container.innerHTML = data.students.map(s => {
                const homework = s.homework || [];
                if (homework.length === 0) {
                    return `<div class="list-item">📝 <strong>${s.name}</strong>: 还没有作业记录哦~</div>`;
                }
                const avg = (homework.reduce((sum, h) => sum + h.score, 0) / homework.length).toFixed(1);
                return `<div class="list-item">📝 <strong>${s.name}</strong>: 平均 ${avg} 分 (共${homework.length}次作业)</div>`;
            }).join('');
        }

        function updateStats() {
            document.getElementById('statStudents').innerHTML = data.students.length;
            document.getElementById('statRewards').innerHTML = data.rewards.length;
            
            const totalAttendance = data.students.reduce((sum, s) => sum + (s.attendance ? s.attendance.length : 0), 0);
            document.getElementById('statAttendance').innerHTML = totalAttendance;
            
            const totalHomework = data.students.reduce((sum, s) => sum + (s.homework ? s.homework.length : 0), 0);
            document.getElementById('statHomework').innerHTML = totalHomework;
        }

        async function handleAddStudent(event) {
            event.preventDefault();
            const form = event.target;
            
            const student = {
                name: form.name.value,
                grade: form.grade.value,
                className: form.classInfo.value,
                status: form.status.value
            };
            
            try {
                const response = await fetch(`${API_URL}/students`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(student)
                });
                
                if (response.ok) {
                    form.reset();
                    const successDiv = document.getElementById('addSuccess');
                    successDiv.classList.remove('hidden');
                    setTimeout(() => { successDiv.classList.add('hidden'); }, 3000);
                    updateUI();
                } else {
                    alert('添加失败，请重试！');
                }
            } catch (error) {
                console.error('添加失败:', error);
                alert('添加失败，请确保后端服务已启动！');
            }
        }

        async function handleAddReward() {
            const studentId = document.getElementById('rewardStudent').value;
            const type = document.getElementById('rewardType').value;
            const reason = document.getElementById('rewardReason').value;
            
            if (!studentId) {
                alert('请先选择小朋友！👧');
                return;
            }
            
            const reward = {
                studentId: parseInt(studentId),
                type,
                reason,
                date: new Date().toISOString().split('T')[0]
            };
            
            try {
                const response = await fetch(`${API_URL}/rewards`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(reward)
                });
                
                if (response.ok) {
                    const student = data.students.find(s => s.id === parseInt(studentId));
                    document.getElementById('rewardReason').value = '';
                    alert(`🎉 ${student ? student.name : '未知'} 获得了一${type}！\n${reason}`);
                    updateUI();
                } else {
                    alert('添加奖励失败！');
                }
            } catch (error) {
                console.error('添加奖励失败:', error);
                alert('添加奖励失败，请确保后端服务已启动！');
            }
        }

        async function handleAddAttendance() {
            const studentId = document.getElementById('attendanceStudent').value;
            const date = document.getElementById('attendanceDate').value;
            const status = document.getElementById('attendanceStatus').value;
            
            if (!studentId) {
                alert('请先选择小朋友！👧');
                return;
            }
            
            const attendance = {
                studentId: parseInt(studentId),
                date,
                status
            };
            
            try {
                const response = await fetch(`${API_URL}/attendance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(attendance)
                });
                
                if (response.ok) {
                    alert('✅ 考勤记录已保存！');
                    updateUI();
                } else {
                    alert('添加考勤失败！');
                }
            } catch (error) {
                console.error('添加考勤失败:', error);
                alert('添加考勤失败，请确保后端服务已启动！');
            }
        }

        async function handleAddHomework() {
            const studentId = document.getElementById('homeworkStudent').value;
            const name = document.getElementById('homeworkName').value;
            const score = parseInt(document.getElementById('homeworkScore').value);
            const date = document.getElementById('homeworkDate').value;
            
            if (!studentId) {
                alert('请先选择小朋友！👧');
                return;
            }
            
            if (!name) {
                alert('请填写作业名称！📚');
                return;
            }
            
            const homework = {
                studentId: parseInt(studentId),
                name,
                score,
                date
            };
            
            try {
                const response = await fetch(`${API_URL}/homework`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(homework)
                });
                
                if (response.ok) {
                    document.getElementById('homeworkName').value = '';
                    alert('✅ 作业记录已保存！');
                    updateUI();
                } else {
                    alert('添加作业失败！');
                }
            } catch (error) {
                console.error('添加作业失败:', error);
                alert('添加作业失败，请确保后端服务已启动！');
            }
        }

        async function deleteStudent(id) {
            if (!confirm('确定要删除这个小朋友吗？🥺')) return;
            
            try {
                const response = await fetch(`${API_URL}/students/${id}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    updateUI();
                } else {
                    alert('删除失败！');
                }
            } catch (error) {
                console.error('删除失败:', error);
                alert('删除失败，请确保后端服务已启动！');
            }
        }

        function viewStudentDetail(id) {
            const student = data.students.find(s => s.id === id);
            if (!student) return;
            
            const rewards = student.rewards || [];
            const attendance = student.attendance || [];
            const homework = student.homework || [];
            
            let detail = `🏫 【${student.name}】的成长档案\n\n`;
            detail += `📚 年级: ${student.grade}\n`;
            detail += `🏠 班级: ${student.className}\n`;
            detail += `💖 状态: ${student.status}\n\n`;
            detail += `🏆 奖励记录 (${rewards.length}个):\n`;
            if (rewards.length === 0) {
                detail += '还没有奖励哦~\n';
            } else {
                rewards.forEach(r => { detail += `- ${r.type}: ${r.reason} (${r.date})\n`; });
            }
            detail += `\n📅 考勤记录 (${attendance.length}次):\n`;
            if (attendance.length === 0) {
                detail += '还没有考勤记录~\n';
            } else {
                attendance.slice(-5).forEach(a => { detail += `- ${a.date}: ${a.status}\n`; });
            }
            detail += `\n📝 作业记录 (${homework.length}次):\n`;
            if (homework.length === 0) {
                detail += '还没有作业记录~\n';
            } else {
                homework.slice(-5).forEach(h => { detail += `- ${h.name}: ${h.score}分 (${h.date})\n`; });
            }
            alert(detail);
        }

        document.addEventListener('DOMContentLoaded', checkLogin);
        document.getElementById('addStudentForm').addEventListener('submit', handleAddStudent);
    </script>
</body>
</html>
